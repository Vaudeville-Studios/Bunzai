name: release

# Builds and publishes a GitHub Release for one tag. Two doors, same room:
#  - push a tag like v0.1.0 by hand, or
#  - get called by auto-release.yml (workflow_call with the tag it just cut).
# Builds the Windows desktop app, the Linux x64 browser app (bare and as a .deb) and the Apple Silicon macOS app, checksums
# them, and publishes with the install guide (.github/RELEASE-NOTES-INSTALL.md) at the top of the
# notes. The tag must match package.json's version.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          PKG="v$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          if [ "$PKG" != "$RELEASE_TAG" ]; then
            echo "tag $RELEASE_TAG does not match package.json $PKG" >&2
            exit 1
          fi
      # A short smoke gate. The full wall (verify:ci) runs in ci.yml on every push, and the S21
      # scale evidence is owner-run on demand (ci.yml workflow_dispatch, performance_evidence).
      - run: bun run verify:release

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Build the helper before the app bake embeds the matching asset in each executable.
      # Existing recovery pins keep pointing at the older release's separate helper assets.
      # New normal releases publish only apps with their matching helper embedded.
      - name: Build the remote-access helper
        run: bun sidecar/build.ts --target=windows-x64
      - name: Build Bunzai.exe + Windows CLI
        run: bun run scripts/build-desktop.ts --cli-targets=bun-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Bunzai.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build the Linux app's embedded helper
        run: bun sidecar/build.ts --target=linux-x64
      - name: Build the Linux app
        run: bun run scripts/build-desktop.ts --no-desktop --cli-targets=bun-linux-x64
      - name: Name the normal Linux download
        run: cp dist/bunzai-cli-linux-x64 dist/Bunzai-Linux
      - name: Package the Linux app for Ubuntu and Debian
        run: bun run scripts/build-deb.ts
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Bunzai-Linux
            dist/Bunzai-Linux.deb
          if-no-files-found: error

  build-macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build the macOS app's embedded helper
        run: bun sidecar/build.ts --target=darwin-arm64
      - name: Build the macOS app
        run: bun run scripts/build-desktop.ts --no-desktop --cli-targets=bun-darwin-arm64
      - name: Name the normal macOS download
        run: cp dist/bunzai-cli-darwin-arm64 dist/Bunzai-macOS
      - name: Prove the macOS app is signed well enough to run, and runs
        run: |
          codesign --verify --strict dist/Bunzai-macOS
          dist/Bunzai-macOS version
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Bunzai-macOS
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum Bunzai.exe Bunzai-Linux Bunzai-Linux.deb Bunzai-macOS > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes (install guide, changelog link, machine-parseable commit block)
        run: |
          cp .github/RELEASE-NOTES-INSTALL.md notes.md
          PREV="$(git tag --sort=-v:refname | grep -vx "${RELEASE_TAG}" | head -n1 || true)"
          echo "" >> notes.md
          if [ -n "$PREV" ]; then
            echo "**Changes**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${RELEASE_TAG}" >> notes.md
            RANGE="${PREV}..${RELEASE_TAG}"
          else
            echo "**Changes**: https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" >> notes.md
            RANGE="${RELEASE_TAG}"
          fi
          # Machine-parseable commit block: Bunzai's in-app version timeline reads EXACTLY this fence.
          # One "<shorthash> <subject>" per commit, newest first; grammar ^[0-9a-f]{7,40} .+$. The app
          # derives each release's headline from the first non-release, non-merge subject; absence of the
          # fence just renders "commit log unavailable" (the parser never guesses from prose).
          echo "" >> notes.md
          echo "## Commits" >> notes.md
          echo '```commits' >> notes.md
          git log --format='%h %s' "$RANGE" | head -n 500 >> notes.md
          echo '```' >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Bunzai ${RELEASE_TAG}" \
            --notes-file notes.md \
            dist/Bunzai.exe \
            dist/Bunzai-Linux \
            dist/Bunzai-Linux.deb \
            dist/Bunzai-macOS \
            dist/SHA256SUMS
